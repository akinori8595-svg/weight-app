<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Weight AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { 
      --primary: #34d399; --primary-dark: #059669; --bg: #f0fdf4; --card: #ffffff; 
      --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --pill-bg: #f1f5f9;
      --alcohol: #60a5fa; --alcohol-dark: #2563eb; --activity: #a855f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
    
    .user-avatar { margin: 10px 0; transition: all 0.3s ease; display: inline-block; width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 10px 25px rgba(5, 150, 105, 0.08); border: 2px solid var(--border); overflow: hidden; background: #ffffff; }
    .user-avatar i { font-size: 55px; color: var(--primary-dark); line-height: 115px; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .user-avatar.recording { filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.6)); transform: scale(1.05); border-color: var(--primary); }
    
    .control-panel, .chart-panel, .history-panel { background: var(--card); padding: 18px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 16px; text-align: left; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
    .param-group { margin-bottom: 14px; text-align: left; }
    .param-row { display: flex; gap: 10px; }
    .param-sub { flex: 1; }
    
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    select, button.toggle-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #f8fafc; color: var(--text); font-size: 14px; cursor: pointer; outline: none; font-weight: 500; -webkit-appearance: none; transition: all 0.2s; }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 12px center; background-size: 14px; padding-right: 36px; }
    
    button.toggle-btn.active-ry { background: #d1fae5; color: var(--primary-dark); font-weight: bold; border-color: var(--primary); }
    button.toggle-btn.active-al { background: #dbeafe; color: var(--alcohol-dark); font-weight: bold; border-color: var(--alcohol); }
    
    .activity-selector { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .activity-selector::-webkit-scrollbar { display: none; }
    .activity-chip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 14px; border: 1px solid var(--border); background: #f8fafc; cursor: pointer; transition: all 0.2s; gap: 4px; }
    .activity-chip i { font-size: 18px; color: var(--text-muted); }
    .activity-chip span { font-size: 10px; font-weight: bold; color: var(--text-muted); }
    .activity-chip.active { background: #f3e8ff; border-color: var(--activity); }
    .activity-chip.active i, .activity-chip.active span { color: var(--activity); }

    .mic-section { margin: 15px 0; text-align: center; }
    .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--primary); color: #ffffff; font-size: 28px; cursor: pointer; box-shadow: 0 8px 25px rgba(52, 211, 153, 0.3); outline: none; transition: all 0.2s; }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn.recording-state { background: #fee2e2; color: #ef4444; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.15); }
    
    #status { font-size: 13px; color: var(--text-muted); min-height: 38px; margin-top: 6px; text-align: center; font-weight: 500; white-space: pre-line; line-height: 1.4; }
    #result { font-size: 15px; font-weight: bold; color: var(--primary-dark); margin-bottom: 12px; text-align: center; }
    
    .panel-title { font-size: 14px; font-weight: bold; color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .tab-group { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500; }
    .tab-btn.active { background: var(--primary-dark); color: #ffffff; font-weight: bold; border-color: var(--primary-dark); }
    
    .chart-container { position: relative; width: 100%; height: 215px; }
    .history-list { max-height: 340px; overflow-y: auto; padding-right: 2px; }
    
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 12px; border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border); transition: background 0.2s; }
    .history-item.editing-mode { background: #fffdec; border-color: #f59e0b; flex-direction: column; align-items: stretch; gap: 10px; }
    
    .item-main { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .item-meta { font-size: 11px; color: var(--text-muted); }
    .item-tags { display: flex; gap: 4px; font-size: 10px; flex-wrap: wrap; }
    .tag-pill { background: #e2e8f0; color: var(--text-muted); padding: 2px 6px; border-radius: 5px; font-weight: 500; }
    .tag-pill.active-pill-ry { background: #d1fae5; color: var(--primary-dark); }
    .tag-pill.active-pill-al { background: #dbeafe; color: var(--alcohol-dark); }
    .tag-pill.active-pill-ac { background: #f3e8ff; color: var(--activity); }
    
    .item-values { text-align: right; margin-right: 8px; margin-left: auto; }
    .weight-val { font-size: 16px; font-weight: bold; color: var(--text); }
    .bmi-val { font-size: 11px; color: var(--text-muted); }
    
    .action-btns { display: flex; gap: 2px; }
    .action-btns button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 6px; border-radius: 6px; }
    .edit-btn { color: #64748b; }
    .delete-btn { color: #cbd5e1; }
    .delete-btn:hover { color: #ef4444; }

    .edit-form-row { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .edit-inputs { display: flex; flex-wrap: wrap; gap: 6px; }
    .edit-inputs input, .edit-inputs select { padding: 6px 8px; font-size: 13px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; outline: none; }
    .edit-inputs input[type="datetime-local"] { font-size: 12px; flex: 1 1 100%; }
    .edit-inputs input[type="number"] { width: 80px; font-weight: bold; }
    .edit-inputs select { -webkit-appearance: auto; background-image: none; padding-right: 8px; }
    .edit-form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .edit-form-actions button { padding: 6px 14px; font-size: 12px; font-weight: bold; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
    .btn-save { background: #f59e0b; color: white; border-color: #d97706; }
    .btn-cancel { background: #f1f5f9; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-avatar" id="avatar">
      <i class="fa-solid fa-user-tie" id="avatarIcon"></i>
      <img id="avatarImg" src="" alt="ユーザーアイコン">
    </div>
    
    <div class="control-panel">
      <div class="param-group param-row">
        <div class="param-sub">
          <label><i class="fa-solid fa-capsules"></i> リベルサス</label>
          <button id="ryBtn" class="toggle-btn" onclick="toggleRybelsus()">なし</button>
        </div>
        <div class="param-sub">
          <label><i class="fa-solid fa-wine-glass"></i> 晩酌フラグ</label>
          <button id="alBtn" class="toggle-btn" onclick="toggleAlcohol()">なし</button>
        </div>
      </div>
      
      <div class="param-group">
        <label><i class="fa-solid fa-clock"></i> 測定タイミング</label>
        <select id="timing">
          <option value="朝 (空腹)">朝 (空腹)</option>
          <option value="朝食後">朝食後</option>
          <option value="昼">昼</option>
          <option value="夕食前">夕食前</option>
          <option value="夕食后">夕食後</option>
          <option value="夜 (入浴前)">夜 (入浴前)</option>
          <option value="夜 (入浴後)">夜 (入浴後)</option>
        </select>
      </div>

      <div class="param-group">
        <label><i class="fa-solid fa-person-running"></i> 前日のアクティビティ</label>
        <div class="activity-selector">
          <div class="activity-chip active" onclick="selectActivity('なし', this)"><i class="fa-solid fa-minus"></i><span>なし</span></div>
          <div class="activity-chip" onclick="selectActivity('テニス', this)"><i class="fa-solid fa-table-tennis-paddle-ball"></i><span>テニス</span></div>
          <div class="activity-chip" onclick="selectActivity('バスケ', this)"><i class="fa-solid fa-basketball"></i><span>バスケ</span></div>
          <div class="activity-chip" onclick="selectActivity('ランニング', this)"><i class="fa-solid fa-person-running"></i><span>ラン</span></div>
          <div class="activity-chip" onclick="selectActivity('ハイキング', this)"><i class="fa-solid fa-mountain-sun"></i><span>ハイク</span></div>
          <div class="activity-chip" onclick="selectActivity('スキー', this)"><i class="fa-solid fa-person-skiing"></i><span>スキー</span></div>
          <div class="activity-chip" onclick="selectActivity('その他', this)"><i class="fa-solid fa-star"></i><span>その他</span></div>
        </div>
      </div>
    </div>

    <div class="mic-section">
      <button id="micBtn" class="mic-btn"><i class="fa-solid fa-microphone" id="micIcon"></i></button>
      <div id="status">ボタンを押して体重を教えてください</div>
      <div id="result"></div>
    </div>

    <div class="chart-panel">
      <div class="tab-group">
        <button class="tab-btn active" onclick="changePeriod('day')">日単位</button>
        <button class="tab-btn" onclick="changePeriod('week')">週単位</button>
        <button class="tab-btn" onclick="changePeriod('month')">月単位</button>
      </div>
      <div class="chart-container"><canvas id="weightChart"></canvas></div>
    </div>

    <div class="history-panel">
      <div class="panel-title"><i class="fa-solid fa-clock-rotate-left"></i> 履歴（直近30件）</div>
      <div class="history-list" id="historyList">データを読み込み中...</div>
    </div>
  </div>

  <script>
    // ⚠️ AkiさんのいつものGASデプロイURLをここに貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw145UaHNqnFsfbZ2f696IM8pG7rPs8QUu4EZj3w-RecyGoVZRpYBqt4XK6zFA4QKgQ_Q/exec";
    const AI_AVATAR_FILENAME = "avatar.png"; 

    let isRybelsusTaken = false; let isAlcoholTaken = false; let selectedActivity = "なし";
    let recognition = null; let rawData = []; let myChart = null;

    const activityEmojis = { 'テニス': '🎾', 'バスケ': '🏀', 'ランニング': '🏃', 'ハイキング': '🥾', 'スキー': '⛷️', 'その他': '⭐', 'なし': '' };

    window.onload = () => { 
      if(AI_AVATAR_FILENAME) {
        document.getElementById('avatarIcon').style.display = 'none';
        const img = document.getElementById('avatarImg');
        img.src = AI_AVATAR_FILENAME;
        img.style.display = 'block';
      }
      fetchChartData(); 
      if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
    };

    function toggleRybelsus() {
      isRybelsusTaken = !isRybelsusTaken;
      const btn = document.getElementById('ryBtn');
      btn.innerText = isRybelsusTaken ? "服用した" : "なし";
      btn.classList.toggle('active-ry', isRybelsusTaken);
    }

    function toggleAlcohol() {
      isAlcoholTaken = !isAlcoholTaken;
      const btn = document.getElementById('alBtn');
      btn.innerText = isAlcoholTaken ? "晩酌あり" : "なし";
      btn.classList.toggle('active-al', isAlcoholTaken);
    }

    function selectActivity(activity, element) {
      selectedActivity = activity;
      document.querySelectorAll('.activity-chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
    }

    function sendToGas(payload) {
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(data => { 
        if(data.status === "success") { 
          resultDiv.innerText = data.message; speak(data.message); fetchChartData(); 
          statusDiv.innerText = "データ保存完了！";
        } else { statusDiv.innerText = "GASエラー: " + data.message; } 
      })
      .catch(err => { statusDiv.innerText = "通信失敗: " + err.message; });
    }

    function cleanAndExtractNumber(str) {
      let text = str.replace(/[０-９．]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
      text = text.replace(/てん|点/g, '.');
      const kanjiMap = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
      for (let k in kanjiMap) { text = text.split(k).join(kanjiMap[k]); }
      if (text.includes('十') || text.includes('じゅう')) {
        text = text.replace(/(\d?)(?:十|じゅう)(\d?)/g, (m, p1, p2) => {
          let tens = p1 ? parseInt(p1) * 10 : 10; let units = p2 ? parseInt(p2) : 0; return tens + units;
        });
      }
      const match = text.match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : null;
    }

    function fetchChartData() {
      fetch(GAS_URL).then(res => res.json()).then(data => { rawData = data; updateChart('day'); renderHistoryList(); }).catch(err => console.error("データ取得失敗:", err));
    }

    function renderHistoryList() {
      const listDiv = document.getElementById('historyList');
      if (!rawData || rawData.length === 0) { listDiv.innerText = "記録されたデータがありません。"; return; }
      let displayData = [...rawData].reverse().slice(0, 30); let html = '';
      
      displayData.forEach(item => {
        if (!item.date) return;
        let date = new Date(item.date);
        
        let year = date.getFullYear();
        let month = String(date.getMonth() + 1).padStart(2, '0');
        let day = String(date.getDate()).padStart(2, '0');
        let hours = String(date.getHours()).padStart(2, '0');
        let minutes = String(date.getMinutes()).padStart(2, '0');
        let localISOTime = `${year}-${month}-${day}T${hours}:${minutes}`;
        
        let dateStr = `${date.getMonth()+1}/${date.getDate()} ${hours}:${minutes}`;
        let ryPill = item.rybelsus === "服用" ? `<span class="tag-pill active-pill-ry">リベルサス</span>` : '';
        let alPill = item.alcohol === "晩酌あり" ? `<span class="tag-pill active-pill-al">晩酌あり</span>` : '';
        let acPill = (item.activity && item.activity !== "なし") ? `<span class="tag-pill active-pill-ac">${activityEmojis[item.activity] || ''} ${item.activity}</span>` : '';
        
        html += `
          <div class="history-item" id="item-${item.rowNum}">
            <div class="item-view-container" style="display:flex; width:100%; align-items:center; justify-content:space-between;">
              <div class="item-main">
                <div class="item-meta">${dateStr}</div>
                <div class="item-tags"><span class="tag-pill">${item.timing}</span>${ryPill}${alPill}${acPill}</div>
              </div>
              <div class="item-values">
                <div class="weight-val">${Number(item.weight).toFixed(1)}<span style="font-size:11px; font-weight:normal; color:var(--text-muted);"> kg</span></div>
                <div class="bmi-val">BMI ${Number(item.bmi).toFixed(1)}</div>
              </div>
              <div class="action-btns">
                <button class="edit-btn" onclick="startEdit(${item.rowNum}, '${localISOTime}', ${item.weight}, '${item.timing}', '${item.rybelsus}', '${item.alcohol}', '${item.activity}')" title="編集"><i class="fa-solid fa-pen-to-square"></i></button>
                <button class="delete-btn" onclick="deleteRecord(${item.rowNum}, ${item.weight})" title="削除"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </div>
          </div>`;
      });
      listDiv.innerHTML = html;
    }

    function startEdit(rowNum, dateStr, weight, timing, rybelsus, alcohol, activity) {
      const itemDiv = document.getElementById(`item-${rowNum}`);
      itemDiv.classList.add('editing-mode');
      
      if(rybelsus !== "服用") rybelsus = "なし";
      if(alcohol !== "晩酌あり") alcohol = "なし";
      if(!activity || activity === "undefined") activity = "なし";

      itemDiv.innerHTML = `
        <div class="edit-form-row">
          <div style="font-size:11px; font-weight:bold; color:#d97706;"><i class="fa-solid fa-pen-to-square"></i> データを編集中（行: ${rowNum}）</div>
          <div class="edit-inputs">
            <input type="datetime-local" id="edit-date-${rowNum}" value="${dateStr}">
            <input type="number" id="edit-weight-${rowNum}" value="${weight}" step="0.1" placeholder="kg">
            
            <select id="edit-timing-${rowNum}">
              <option value="朝 (空腹)" ${timing==='朝 (空腹)'?'selected':''}>朝 (空腹)</option>
              <option value="朝食後" ${timing==='朝食後'?'selected':''}>朝食後</option>
              <option value="昼" ${timing==='昼'?'selected':''}>昼</option>
              <option value="夕食前" ${timing==='夕食前'?'selected':''}>夕食前</option>
              <option value="夕食後" ${timing==='夕食後'?'selected':''}>夕食後</option>
              <option value="夜 (入浴前)" ${timing==='夜 (入浴前)'?'selected':''}>夜 (入浴前)</option>
              <option value="夜 (入浴後)" ${timing==='夜 (入浴後)'?'selected':''}>夜 (入浴後)</option>
            </select>
            
            <select id="edit-ry-${rowNum}">
              <option value="服用" ${rybelsus==='服用'?'selected':''}>💊 服用</option>
              <option value="なし" ${rybelsus==='なし'?'selected':''}>なし</option>
            </select>
            
            <select id="edit-al-${rowNum}">
              <option value="晩酌あり" ${alcohol==='晩酌あり'?'selected':''}>🍺 晩酌あり</option>
              <option value="なし" ${alcohol==='なし'?'selected':''}>なし</option>
            </select>
            
            <select id="edit-ac
