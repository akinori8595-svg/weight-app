<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Smart Weight AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { 
      --primary: #34d399; --primary-dark: #059669; --bg: #f0fdf4; --card: #ffffff; 
      --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --pill-bg: #f1f5f9;
      --alcohol: #60a5fa; --alcohol-dark: #2563eb;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); text-align: center; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; padding: 10px; }
    
    .user-avatar { 
      margin: 15px 0; transition: all 0.3s ease; display: inline-block; 
      width: 130px; height: 130px; border-radius: 50%;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.08); border: 2px solid var(--border);
      overflow: hidden; background: #ffffff;
    }
    .user-avatar i { font-size: 70px; color: var(--primary-dark); line-height: 135px; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .user-avatar.recording { filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.6)); transform: scale(1.05); border-color: var(--primary); }
    
    .control-panel, .chart-panel, .history-panel { background: var(--card); padding: 24px; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 24px; text-align: left; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
    .param-group { margin-bottom: 18px; text-align: left; }
    .param-row { display: flex; gap: 12px; }
    .param-sub { flex: 1; }
    
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    select, button.toggle-btn { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: #f8fafc; color: var(--text); font-size: 15px; cursor: pointer; outline: none; font-weight: 500; -webkit-appearance: none; }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; }
    
    button.toggle-btn.active-ry { background: #d1fae5; color: var(--primary-dark); font-weight: bold; border-color: var(--primary); }
    button.toggle-btn.active-al { background: #dbeafe; color: var(--alcohol-dark); font-weight: bold; border-color: var(--alcohol); }
    
    .mic-btn { width: 85px; height: 85px; border-radius: 50%; border: none; background: var(--primary); color: #ffffff; font-size: 30px; cursor: pointer; margin: 10px 0; box-shadow: 0 8px 25px rgba(52, 211, 153, 0.4); outline: none; }
    .mic-btn.recording-state { background: #fee2e2; color: #ef4444; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2); }
    
    #status { font-size: 14px; color: var(--text-muted); min-height: 40px; margin-top: 8px; text-align: center; font-weight: 500; white-space: pre-line; }
    #result { font-size: 16px; font-weight: bold; color: var(--primary-dark); margin-bottom: 15px; text-align: center; }
    .panel-title { font-size: 15px; font-weight: bold; color: var(--text-muted); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    .tab-group { display: flex; gap: 10px; margin-bottom: 18px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; color: var(--text-muted); cursor: pointer; font-size: 14px; font-weight: 500; }
    .tab-btn.active { background: var(--primary-dark); color: #ffffff; font-weight: bold; border-color: var(--primary-dark); }
    .chart-container { position: relative; width: 100%; height: 200px; }
    .history-list { max-height: 250px; overflow-y: auto; padding-right: 5px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 14px 18px; border-radius: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
    .item-main { display: flex; flex-direction: column; gap: 6px; }
    .item-meta { font-size: 12px; color: var(--text-muted); }
    .item-tags { display: flex; gap: 6px; font-size: 11px; flex-wrap: wrap; }
    .tag-pill { background: #e2e8f0; color: var(--text-muted); padding: 3px 8px; border-radius: 6px; font-weight: 500; }
    .tag-pill.active-pill-ry { background: #d1fae5; color: var(--primary-dark); }
    .tag-pill.active-pill-al { background: #dbeafe; color: var(--alcohol-dark); }
    .item-values { text-align: right; margin-right: 15px; margin-left: auto; }
    .weight-val { font-size: 19px; font-weight: bold; color: var(--text); }
    .bmi-val { font-size: 12px; color: var(--text-muted); }
    .delete-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 8px; }
    .delete-btn:hover { color: #ef4444; }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-avatar" id="avatar">
      <i class="fa-solid fa-user-tie" id="avatarIcon"></i>
      <img id="avatarImg" src="" alt="ユーザーアイコン">
    </div>
    
    <div class="control-panel">
      <div class="param-group param-row">
        <div class="param-sub">
          <label><i class="fa-solid fa-capsules"></i> リベルサス</label>
          <button id="ryBtn" class="toggle-btn" onclick="toggleRybelsus()">なし</button>
        </div>
        <div class="param-sub">
          <label><i class="fa-solid fa-wine-glass"></i> 晩酌フラグ</label>
          <button id="alBtn" class="toggle-btn" onclick="toggleAlcohol()">なし</button>
        </div>
      </div>
      
      <div class="param-group">
        <label><i class="fa-solid fa-clock"></i> 測定タイミング</label>
        <select id="timing">
          <option value="朝 (空腹)">朝 (空腹)</option>
          <option value="朝食後">朝食後</option>
          <option value="昼">昼</option>
          <option value="夕食前">夕食前</option>
          <option value="夕食後">夕食後</option>
          <option value="夜 (入浴前)">夜 (入浴前)</option>
          <option value="夜 (入浴後)">夜 (入浴後)</option>
        </select>
      </div>
    </div>

    <button id="micBtn" class="mic-btn"><i class="fa-solid fa-microphone" id="micIcon"></i></button>
    <div id="status">ボタンを押して体重を教えてください</div>
    <div id="result"></div>

    <div class="chart-panel">
      <div class="tab-group">
        <button class="tab-btn active" onclick="changePeriod('day')">日単位</button>
        <button class="tab-btn" onclick="changePeriod('week')">週単位</button>
        <button class="tab-btn" onclick="changePeriod('month')">月単位</button>
      </div>
      <div class="chart-container"><canvas id="weightChart"></canvas></div>
    </div>

    <div class="history-panel">
      <div class="panel-title"><i class="fa-solid fa-clock-rotate-left"></i> 履歴（直近30件）</div>
      <div class="history-list" id="historyList">データを読み込み中...</div>
    </div>
  </div>

  <script>
    // ⚠️【必須】最新の「全員」対象のGASのURLを正確に貼り付けてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzo4bZ1NN_ve_aqTNRB3o1VrGw571-lfn540qvLA6xtWTS54LyPd8XHFwgEjCuhSz6rXw/exec";

    // 💡【新仕様】Base64の代わりに同じ場所にある画像ファイル名を指定するだけ！
    const AI_AVATAR_FILENAME = "avatar.png"; 

    let isRybelsusTaken = false; let isAlcoholTaken = false; let recognition = null; let rawData = []; let myChart = null;

    window.onload = () => { 
      if(AI_AVATAR_FILENAME) {
        document.getElementById('avatarIcon').style.display = 'none';
        const img = document.getElementById('avatarImg');
        img.src = AI_AVATAR_FILENAME; // 👈 同じサーバー内の画像を相対パスでスマートに読み込みます
        img.style.display = 'block';
      }
      fetchChartData(); 
    };

    function toggleRybelsus() {
      isRybelsusTaken = !isRybelsusTaken;
      const btn = document.getElementById('ryBtn');
      btn.innerText = isRybelsusTaken ? "服用した" : "なし";
      btn.classList.toggle('active-ry', isRybelsusTaken);
    }

    function toggleAlcohol() {
      isAlcoholTaken = !isAlcoholTaken;
      const btn = document.getElementById('alBtn');
      btn.innerText = isAlcoholTaken ? "晩酌あり" : "なし";
      btn.classList.toggle('active-al', isAlcoholTaken);
    }

    function sendToGas(payload) {
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => { if (!res.ok) { throw new Error('HTTPエラー: ' + res.status); } return res.json(); })
      .then(data => { 
        if(data.status === "success") { 
          resultDiv.innerText = data.message; speak(data.message); fetchChartData(); 
          statusDiv.innerText = "データ保存完了！";
        } else { statusDiv.innerText = "GASエラー: " + data.message; } 
      })
      .catch(err => { statusDiv.innerText = "通信失敗: " + err.message; });
    }

    function cleanAndExtractNumber(str) {
      let text = str.replace(/[０-９．]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
      text = text.replace(/てん|点/g, '.');
      const kanjiMap = {'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
      for (let k in kanjiMap) { text = text.split(k).join(kanjiMap[k]); }
      if (text.includes('十') || text.includes('じゅう')) {
        text = text.replace(/(\d?)(?:十|じゅう)(\d?)/g, (m, p1, p2) => {
          let tens = p1 ? parseInt(p1) * 10 : 10; let units = p2 ? parseInt(p2) : 0; return tens + units;
        });
      }
      const match = text.match(/\d+(\.\d+)?/);
      return match ? parseFloat(match[0]) : null;
    }

    function fetchChartData() {
      fetch(GAS_URL).then(res => res.json()).then(data => { rawData = data; updateChart('day'); renderHistoryList(); }).catch(err => console.error("データ取得失敗:", err));
    }

    function renderHistoryList() {
      const listDiv = document.getElementById('historyList');
      if (rawData.length === 0) { listDiv.innerText = "記録されたデータがありません。"; return; }
      let displayData = [...rawData].reverse().slice(0, 30); let html = '';
      displayData.forEach(item => {
        let date = new Date(item.date);
        let dateStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        let ryPill = item.rybelsus === "服用" ? `<span class="tag-pill active-pill-ry">リベルサス</span>` : '';
        let alPill = item.alcohol === "晩酌あり" ? `<span class="tag-pill active-pill-al">晩酌あり</span>` : '';
        html += `<div class="history-item"><div class="item-main"><div class="item-meta">${dateStr}</div><div class="item-tags"><span class="tag-pill">${item.timing}</span>${ryPill}${alPill}</div></div><div class="item-values"><div class="weight-val">${item.weight.toFixed(1)}<span style="font-size:12px; font-weight:normal; color:var(--text-muted);"> kg</span></div><div class="bmi-val">BMI ${item.bmi.toFixed(1)}</div></div><button class="delete-btn" onclick="deleteRecord(${item.rowNum}, ${item.weight})"><i class="fa-solid fa-trash-can"></i></button></div>`;
      });
      listDiv.innerHTML = html;
    }

    function deleteRecord(rowNum, weight) {
      if (!confirm(`体重 ${weight}kg の記録を本当に削除しますか？`)) return;
      document.getElementById('historyList').innerText = "削除処理中...";
      fetch(GAS_URL, { method: "POST", body: JSON.stringify({ type: "delete", rowNum: rowNum }) }).then(res => res.json()).then(data => { if (data.status === "success") { fetchChartData(); } else { alert("削除失敗: " + data.message); } }).catch(err => alert("通信エラー"));
    }

    function changePeriod(period) { document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); updateChart(period); }

    function updateChart(period) {
      if (rawData.length === 0) return;
      let labels = []; let weights = []; let sortedData = [...rawData].filter(d => d.date).sort((a, b) => new Date(a.date) - new Date(b.date));
      if (period === 'day') { let recentData = sortedData.slice(-14); labels = recentData.map(d => { let date = new Date(d.date); return `${date.getMonth()+1}/${date.getDate()}`; }); weights = recentData.map(d => d.weight); }
      else if (period === 'week') {
        let weeks = {}; sortedData.forEach(d => { let date = new Date(d.date); let weekKey = getWeekNumber(date); if (!weeks[weekKey]) weeks[weekKey] = { sum: 0, count: 0, label: `${date.getMonth()+1}/${date.getDate()}週` }; weeks[weekKey].sum += d.weight; weeks[weekKey].count++; });
        let keys = Object.keys(weeks).slice(-8); labels = keys.map(k => weeks[k].label); weights = keys.map(k => (weeks[k].sum / weeks[k].count).toFixed(1));
      } else if (period === 'month') {
        let months = {}; sortedData.forEach(d => { let date = new Date(d.date); let monthKey = `${date.getFullYear()}-${date.getMonth()+1}`; if (!months[monthKey]) months[monthKey] = { sum: 0, count: 0, label: `${date.getMonth()+1}月` }; months[monthKey].sum += d.weight; months[monthKey].count++; });
        let keys = Object.keys(months).slice(-6); labels = keys.map(k => months[k].label); weights = keys.map(k => (months[k].sum / months[k].count).toFixed(1));
      }
      const ctx = document.getElementById('weightChart').getContext('2d'); if (myChart) myChart.destroy();
      myChart = new Chart(ctx, { type: 'line', data: { labels: labels, datasets: [{ label: '体重 (kg)', data: weights, borderColor: '#10b981', backgroundColor: 'rgba(52, 211, 153, 0.15)', borderWidth: 3, fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#10b981' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b' } }, x: { grid: { display: false }, ticks: { color: '#64748b' } } } } });
    }

    function getWeekNumber(d) { let date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7)); let yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1)); return `${date.getUTCFullYear()}-W${Math.ceil((((date - yearStart) / 86400000) + 1) / 7)}`; }

    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    micBtn.onclick = () => {
      if (recognition) { recognition.stop(); return; }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { statusDiv.innerText = "ブラウザ非対応"; return; }
      
      recognition = new SpeechRecognition(); recognition.lang = 'ja-JP';
      recognition.onstart = () => { micBtn.classList.add('recording-state'); micIcon.className = "fa-solid fa-microphone-lines"; avatar.classList.add('recording'); statusDiv.innerText = "聞き取り中...\n「65.5」のように話してください"; };
      recognition.onend = () => { micBtn.classList.remove('recording-state'); micIcon.className = "fa-solid fa-microphone"; avatar.classList.remove('recording'); recognition = null; };
      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript; const weight = cleanAndExtractNumber(text);
        if (weight !== null) {
          statusDiv.innerText = `音声認識: 「${text}」\n➔ 保存中...`;
          sendToGas({ weight: weight, rybelsus: isRybelsusTaken, alcohol: isAlcoholTaken, timing: document.getElementById('timing').value });
        } else { statusDiv.innerText = `音声認識: 「${text}」\n⚠️数値が読み取れませんでした。`; }
      };
      recognition.start();
    };

    function speak(text) { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); } }
  </script>
</body>
</html>
